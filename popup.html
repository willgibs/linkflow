<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Linkflow</title>
    <link rel="stylesheet" href="src/styles/popup.css" />
  </head>
  <body>
    <div class="container" id="main-container">
      <div class="header-row">
        <a
          href="https://github.com/willgibs/linkflow"
          target="_blank"
          rel="noopener noreferrer"
        >
          <img src="assets/icons/logo.svg" alt="Linkflow" class="logo" />
        </a>
        <h1>Linkflow</h1>
        <button
          id="theme-toggle"
          class="theme-toggle"
          aria-label="Toggle theme"
        >
          <!-- Icon will be set by JS -->
        </button>
      </div>

      <section class="scan-section">
        <button id="scan-all" class="btn btn-primary">
          <span>Scan All Links</span>
        </button>
        <button id="scan-empty" class="btn btn-secondary">
          <span>Find Empty Links</span>
        </button>
        <button id="scan-unique" class="btn btn-secondary">
          <span>Find Unique Links</span>
        </button>
      </section>

      <div id="loading-spinner" class="spinner hidden"></div>
      <a href="#" id="result-count" class="result-text"></a>
    </div>

    <div class="container hidden" id="list-container">
      <div class="button-row">
        <button id="back-button" class="btn btn-secondary">
          <span>Back</span>
        </button>
        <button id="export-csv" class="btn btn-secondary">
          <span>Export CSV</span>
        </button>
      </div>
      <div class="links-list" id="links-list"></div>
    </div>
    <script src="src/scripts/themeManager.js"></script>
    <script src="src/scripts/popup.js"></script>
  </body>
</html>
