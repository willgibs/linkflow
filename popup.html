<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Linkflow</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="container" id="main-container">
      <img src="logo.svg" alt="Linkflow" class="logo" />
      <h1>Linkflow</h1>

      <div class="buttons">
        <button id="scan-all" class="btn btn-primary">
          <span>Scan All Links</span>
        </button>
        <button id="scan-empty" class="btn btn-secondary">
          <span>Find Empty Links</span>
        </button>
        <button id="scan-unique" class="btn btn-secondary">
          <span>Find Unique Links</span>
        </button>
      </div>

      <div id="loading-spinner" class="spinner hidden"></div>
      <a href="#" id="result-count" class="result-text"></a>
    </div>

    <div class="container hidden" id="list-container">
      <button id="back-button" class="btn btn-secondary">
        <span>← Back</span>
      </button>
      <div class="links-list" id="links-list"></div>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
